<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clinic</title>
    <link rel = "stylesheet" href="styles.css">
    <script src="script.js"></script> 
</head>
<body>
    
     <Section class="container">
     <!-- Form -->
    <Section class="form-section">
      <h1>Create Account</h1>
      <p>Create your profile and take the first step towards easier, more connected healthcare.</p>

      <label>Full Name *</label>
      <input type="text" id="fullName" placeholder="Enter your Full Name">

      <label>Email Address *</label>
      <input type="email" id="email" placeholder="Enter your Email">

      <label>Phone Number *</label>
      <input type="tel" id="phone" placeholder="+234 80 1234567">

      <label>Password *</label>
      <input type="password" id="password" placeholder="********">

      <label>Confirm Password *</label>
      <input type="password" id="confirmPassword" placeholder="********">

      <button class="btn" onclick="validateForm()">Next</button>
    </Section>

    <!-- Image -->
    <div class="image-section">
      <img src="Images/nappy-jkQzYGJ7dBA-unsplash 1.png" alt="A Picture of a doctor with a stetoscope">
    </div>
  </Section>

</body>
</html>
